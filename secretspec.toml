[project]
name = "automation-action-ui-kit"
revision = "1.0"

[profiles.default]
# Local controls: where and how `forge` commands operate. They are not app
# secrets; Fence Rider reads them to target the opt-in `forge:*` scripts.
FORGE_SITE = { description = "Forge site hostname, e.g. example.atlassian.net", required = true }
FORGE_PRODUCT = { description = "Forge product (jira, confluence, compass, jsm)", default = "jira" }
FORGE_ENVIRONMENT = { description = "Forge environment name (development, staging, production)", default = "development" }

AUTOMATION_API_EMAIL = { description = "Atlassian account email owning the Automation API token", required = true }
AUTOMATION_API_TOKEN = { description = "Atlassian API token for read-only Automation retrieval", required = true }

[scopes.runtime]
secrets = ["AUTOMATION_API_EMAIL", "AUTOMATION_API_TOKEN"]
